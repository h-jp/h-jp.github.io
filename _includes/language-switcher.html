<details class="language-switcher">
  <summary class="language-toggle" aria-label="Language / 语言" title="Language / 语言" aria-controls="language-options">
    <svg class="language-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
    </svg>
  </summary>
  <nav id="language-options" class="language-options" aria-label="Language / 语言">
    <a href="{% if lang == 'en' %}{{ page.url | relative_url }}{% else %}{{ page.translation | relative_url }}{% endif %}" lang="en" hreflang="en"{% if lang == 'en' %} aria-current="true"{% else %} data-translation{% if site.chinese_enabled == true %} data-preserve-anchor{% endif %}{% endif %}>
      <span>English</span>
      {% if lang == 'en' %}<svg class="language-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="m4 10 4 4 8-8"/></svg>{% endif %}
    </a>
    <a href="{% if lang == 'zh' %}{{ page.url | relative_url }}{% else %}{{ page.translation | relative_url }}{% endif %}" lang="zh-CN" hreflang="zh-CN"{% if lang == 'zh' %} aria-current="true"{% else %} data-translation{% if site.chinese_enabled == true %} data-preserve-anchor{% endif %}{% endif %}>
      <span>简体中文</span>
      {% if lang == 'zh' %}<svg class="language-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="m4 10 4 4 8-8"/></svg>{% endif %}
    </a>
  </nav>
</details>
