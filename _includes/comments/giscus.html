{% assign giscus_lang = 'en' %}
{% if page.lang contains 'zh' %}{% assign giscus_lang = 'zh-CN' %}{% endif %}
<script src="https://giscus.app/client.js"
        data-repo="{{ giscus_config.repo | escape }}"
        data-repo-id="{{ giscus_repo_id | escape }}"
        data-category="{{ giscus_config.category | escape }}"
        data-category-id="{{ giscus_category_id | escape }}"
        data-mapping="specific"
        data-term="{{ discussion_id | escape }}"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="light"
        data-lang="{{ giscus_lang }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async></script>
