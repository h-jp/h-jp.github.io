{% include academic/context.html %}
<section aria-labelledby="courses-heading"><h2 id="courses-heading" class="subheading">{{ ui.courses_heading[lang] }}</h2>
{% include academic/course-list.html limit=site.teaching_page_size %}
</section>
{% if site.data.courses.size > site.teaching_page_size %}<div class="archive-nav"><p>{{ site.data.descriptions.archives.teaching[lang] }}</p><a class="text-link more-link" href="{{ prefix | append: '/teaching/archive/' | relative_url }}" aria-label="{{ ui.more[lang] }}: {{ ui.teaching_archive[lang] }}">{{ ui.more[lang] }} <span aria-hidden="true">→</span></a></div>{% endif %}
