{% assign target = page.redirect.to | remove_first: site.url %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting / 正在跳转</title>
  <link rel="canonical" href="{{ page.redirect.to }}">
  <meta http-equiv="refresh" content="0; url={{ target }}">
</head>
<body><p><a href="{{ target }}">Continue / 继续访问</a></p></body>
</html>
