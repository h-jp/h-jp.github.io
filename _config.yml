locale: en-US
title: Jiangping Huang
title_separator: '-'
name: Jiangping Huang
description: 'Academic homepage of Jiangping Huang: artificial intelligence, intelligent software engineering,
  and intelligent robotics.'
url: https://h-jp.github.io
baseurl: ''
repository: h-jp/h-jp.github.io
teaser: null
breadcrumbs: false
words_per_minute: 160
news_page_size: 3
teaching_page_size: 3
chinese_enabled: true
chinese_blog_enabled: true
future: true
read_more: disabled
talkmap_link: false
comments:
  provider: false
  enabled: false
staticman:
  allowedFields:
  - name
  - email
  - url
  - message
  branch: gh-pages
  commitMessage: New comment.
  filename: comment-{@timestamp}
  format: yml
  moderation: true
  path: _data/comments/{options.slug}
  requiredFields:
  - name
  - email
  - message
  transforms:
    email: md5
  generatedFields:
    date:
      type: date
      options:
        format: iso8601
atom_feed:
  path: null
google_site_verification: null
bing_site_verification: null
alexa_site_verification: null
yandex_site_verification: null
twitter:
  username: null
facebook:
  username: null
  app_id: null
  publisher: null
og_image: null
social:
  type: null
  name: null
  links: null
analytics:
  provider: false
post_views:
  enabled: false
author:
  name: Jiangping Huang
  avatar: bio-photo-new.jpg
  email: huangjp@cqupt.edu.cn
  research_group: https://csma-research-group.github.io
  weibo: jiangpinghuang
include:
- .htaccess
- _pages
- files
exclude:
- '*.sublime-project'
- '*.sublime-workspace'
- .asset-cache
- .bundle
- .jekyll-assets-cache
- .sass-cache
- CHANGELOG
- CHANGELOG.md
- CONTRIBUTING.md
- Capfile
- Gemfile
- Gemfile.lock
- Gruntfile.js
- LICENSE
- README
- README.md
- Rakefile
- _archive
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
- config
- docs
- docs/site-maintenance.md
- gulpfile.js
- log
- markdown_generator
- node_modules
- package-lock.json
- package.json
- personal_homepage_and_repo_guide.md
- scripts
- talkmap
- test
- tests
- tmp
- vendor
- work
keep_files:
- .git
- .svn
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: single
    section: blog
- scope:
    path: ''
    type: pages
  values:
    layout: section
- scope:
    path: ''
    type: publications
  values:
    layout: publication
    section: publications
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Shanghai
plugins:
- jekyll-paginate
- jekyll-sitemap
- jekyll-gist
- jekyll-feed
- jekyll-redirect-from
whitelist:
- jekyll-paginate
- jekyll-sitemap
- jekyll-gist
- jekyll-feed
- jemoji
- jekyll-redirect-from
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
