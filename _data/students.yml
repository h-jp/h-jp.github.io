admissions:
  title:
    en: Research Opportunities and Admissions
    zh: 科研机会与招生
  invitation:
    en: I welcome motivated undergraduate and graduate students with strong foundations who are interested in sustained research collaboration. I also welcome international students with prior research experience, particularly those who have published full-length research papers at conferences or in journals ranked A or B by the <a href="https://www.ccf.org.cn/Academic_Evaluation/By_category/" title="CCF recommended conferences and journals">China Computer Federation (CCF)</a>.
    zh: 欢迎基础扎实、主动学习且愿意长期投入科研的优秀本科生与研究生加入，围绕共同的研究问题开展持续合作。同时欢迎具有研究基础的国际学生；在 <a href="https://www.ccf.org.cn/Academic_Evaluation/By_category/" title="中国计算机学会推荐国际学术会议和期刊目录">CCF A/B 类会议或期刊</a>发表过正式会议长文或期刊研究论文者优先考虑。
