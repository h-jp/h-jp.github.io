  zh: 受邀担任AAAI、EMNLP、NLPCC、PRICAI等国际会议以及ACM TKDD、ACM TALLIP、软件学报等期刊审稿人。
research:
- id: artificial-intelligence
  title:
    en: Artificial Intelligence
    zh: 人工智能
  description:
    en: We study cognition, reasoning, and collaboration in multi-agent systems, exploring theories, methods,
      and implementation approaches for agents whose behavior can be verified and whose capabilities can evolve.
    zh: 研究多智能体的认知、推理与协同机制，探索可验证、可演化的智能体关键理论方法与实现路径。
  short:
    en: Cognition, reasoning, and collaboration in verifiable, evolving multi-agent systems.
    zh: 多智能体认知、推理与协同，以及可验证、可演化的智能体。
- id: intelligent-software-engineering
  title:
    en: Intelligent Software Engineering
    zh: 智能软件工程
  description:
    en: We study software requirements analysis, code generation, and software reverse engineering, exploring
      intelligent methods across the software development lifecycle and their application in representative
      scenarios.
    zh: 研究软件需求分析、代码生成与软件逆向工程，探索软件开发全流程的智能化方法与典型场景应用。
  short:
    en: Requirements analysis, code generation, and reverse engineering across the software lifecycle.
    zh: 软件需求分析、代码生成与逆向工程，以及软件开发全流程的智能化。
- id: intelligent-robotics
  title:
    en: Intelligent Robotics
    zh: 智能机器人
  description:
    en: We study perception, decision-making, planning, and control for intelligent robots in complex environments,
      exploring the mechanisms of human–robot collaboration and strategies for continual evolution.
    zh: 研究智能机器人在复杂环境中的感知、决策、规划与控制能力，探索人机协同的核心机制与持续演化策略。
  short:
    en: Perception, planning, and control in complex environments, with human–robot collaboration.
    zh: 复杂环境中的感知、决策、规划与控制，以及人机协同。
