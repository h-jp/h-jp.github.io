intro:
  en: My research connects artificial intelligence, intelligent software engineering, and intelligent robotics to address fundamental and real-world problems.
  zh: 研究人工智能、智能软件工程与智能机器人的交叉融合，探索相关理论、方法及其实际应用。
bio:
  en: Jiangping Huang is a faculty member and master's supervisor at Chongqing University of Posts and Telecommunications.
    He received his Ph.D. from Wuhan University and conducted postdoctoral research at Nanyang Technological
    University. He has participated in one Key Program project funded by the National Natural Science Foundation
    of China, served as a major contributor to three General Program projects funded by the same foundation
    and one project supported by the National Social Science Fund of China, and led five provincial or ministerial
    research projects. He has published nearly 20 academic papers, filed more than 10 national invention patent
    applications, and registered more than 10 software copyrights. He has been invited to review for international
    conferences including AAAI, EMNLP, NLPCC, and PRICAI, and journals including ACM TKDD, ACM TALLIP, and
    Journal of Software.
  zh: 黄江平，重庆邮电大学教师、硕士生导师。获武汉大学博士学位，曾在新加坡南洋理工大学从事博士后研究。先后参与国家自然科学基金重点项目1项，主研国家自然科学基金面上项目3项、国家社科基金项目1项，主持省部级项目5项。发表学术论文近20篇，申请国家发明专利10余项，登记软件著作权10余项。受邀担任AAAI、EMNLP、NLPCC、PRICAI等国际会议以及ACM
    TKDD、ACM TALLIP、软件学报等期刊审稿人。
