supervision:
  summary:
    en: I supervise undergraduate research, capstone projects, and master's theses. Several undergraduate students I have mentored have gained recommendation-based admission to Double First-Class universities in China. I also support and recommend my master's students for doctoral study at Double First-Class universities, including former Project 985 institutions.
    zh: 指导本科生科研、毕业设计与硕士学位论文。所指导的本科生中，多人通过推免进入“双一流”高校深造；同时，支持并推荐所指导的硕士生赴原“985工程”等“双一流”高校攻读博士学位。
  invitation:
    en: I welcome motivated undergraduate and graduate students with strong foundations who are interested in sustained research collaboration. International students with a solid research background are also welcome; preference is given to applicants with full conference papers or journal articles in <a href="https://www.ccf.org.cn/Academic_Evaluation/By_category/" title="China Computer Federation (CCF) recommended conferences and journals">CCF A/B venues</a>.
    zh: 欢迎基础扎实、主动学习且愿意长期投入科研的优秀本科生与研究生加入，围绕共同的研究问题开展持续合作。同时欢迎具有研究基础的国际学生；在 <a href="https://www.ccf.org.cn/Academic_Evaluation/By_category/" title="中国计算机学会推荐国际学术会议和期刊目录">CCF A/B 类会议或期刊</a>发表过正式会议长文或期刊研究论文者优先考虑。
service:
